name: Build and publish NNLOJET website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Use the distribution Python so apt-installed python3-lxml is importable.
  PYTHON: /usr/bin/python3

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # lwarp needs ifptex.sty (shipped only by texlive-lang-japanese) and
      # lmodern.sty (only a Recommends, so list it explicitly).
      - name: Install the manual toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-extra texlive-fonts-extra \
            texlive-fonts-recommended cm-super \
            texlive-lang-japanese lmodern \
            poppler-utils python3-lxml

      - name: Build PDF and HTML manual
        run: bash web/make_manual.sh

      - name: Assemble and validate website
        run: |
          "$PYTHON" web/update.py
          "$PYTHON" web/check_site.py

      - name: Upload publishable website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/autogenerated/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
